<!DOCTYPE html>
<html>
<head>
    <title>Test Buttons</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Test AI Math Stumper Buttons</h1>
    
    <div class="test-section">
        <h2>Test Generate Rank-1 Matrix</h2>
        <button onclick="testGenerateMatrix()">Test Generate Matrix</button>
        <div id="generate-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Solve ODE System</h2>
        <button onclick="testSolveODE()">Test Solve ODE</button>
        <div id="solve-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Get Explanation</h2>
        <button onclick="testGetExplanation()">Test Get Explanation</button>
        <div id="explanation-result" class="result"></div>
    </div>

    <script>
        // Mock the React component functions for testing
        let currentMatrix = Array(16).fill(0);
        let currentTaskId = null;
        
        function testGenerateMatrix() {
            const resultDiv = document.getElementById('generate-result');
            resultDiv.innerHTML = 'Testing Generate Rank-1 Matrix...';
            
            try {
                // Generate rank-1 matrix logic
                const u = [Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1];
                const v = [Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1];
                
                currentMatrix = [];
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        currentMatrix.push(parseFloat((u[i] * v[j]).toFixed(4)));
                    }
                }
                
                resultDiv.innerHTML = 'Success! Generated matrix: ' + currentMatrix.join(', ');
            } catch (error) {
                resultDiv.innerHTML = 'Error: ' + error.message;
            }
        }
        
        async function testSolveODE() {
            const resultDiv = document.getElementById('solve-result');
            resultDiv.innerHTML = 'Testing Solve ODE System...';
            
            try {
                // Convert flat array to 2D matrix
                const coefficients = [];
                for (let i = 0; i < 4; i++) {
                    coefficients.push(currentMatrix.slice(i * 4, (i + 1) * 4));
                }
                
                const initialConditions = { x0: 1, y0: 1, z0: 1, w0: 1 };
                const targetTime = 1;
                
                resultDiv.innerHTML = 'Making API call to create task...';
                
                const response = await fetch('http://localhost:8000/api/create_custom/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        coefficients: { linear: coefficients },
                        initial_conditions: initialConditions,
                        target_time: targetTime
                    })
                });
                
                if (response.ok) {
                    const task = await response.json();
                    currentTaskId = task.task_id;
                    resultDiv.innerHTML += '<br>Task created successfully! Task ID: ' + task.task_id;
                    
                    // Get solution
                    resultDiv.innerHTML += '<br>Getting solution...';
                    const solutionResponse = await fetch('http://localhost:8000/api/task/' + task.task_id + '/solution/');
                    
                    if (solutionResponse.ok) {
                        const solution = await solutionResponse.json();
                        resultDiv.innerHTML += '<br>Solution received! Final values: ' + solution.final_values.join(', ');
                    } else {
                        resultDiv.innerHTML += '<br>Error getting solution: ' + solutionResponse.status;
                    }
                } else {
                    resultDiv.innerHTML += '<br>Error creating task: ' + response.status;
                }
            } catch (error) {
                resultDiv.innerHTML += '<br>Error: ' + error.message;
            }
        }
        
        async function testGetExplanation() {
            const resultDiv = document.getElementById('explanation-result');
            resultDiv.innerHTML = 'Testing Get Explanation...';
            
            if (!currentTaskId) {
                resultDiv.innerHTML = 'Error: No task ID available. Please solve an ODE first.';
                return;
            }
            
            try {
                resultDiv.innerHTML = 'Getting explanation for task ID: ' + currentTaskId;
                
                const response = await fetch('http://localhost:8000/api/task/' + currentTaskId + '/explain/');
                
                if (response.ok) {
                    const explanation = await response.json();
                    resultDiv.innerHTML += '<br>Explanation received: ' + explanation.explanation.substring(0, 100) + '...';
                } else {
                    resultDiv.innerHTML += '<br>Error getting explanation: ' + response.status;
                }
            } catch (error) {
                resultDiv.innerHTML += '<br>Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
